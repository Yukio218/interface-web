<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercices sur les formulaires</title>
  </head>
  <body>
    <h1>Exercices sur les formulaires HTML</h1>

    <!-- Exercice 11: Formulaire d'inscription avec méthode POST -->
    <section>
      <h2>Formulaire d'inscription</h2>
      <!-- À COMPLÉTER: Créer le formulaire d'inscription -->
      <form action="../resultats/inscription.html" method="post">
        <label for="nom">Nom Complet:</label>
        <input type="name" name="nom" id="nom" /><br />

        <label for="courriel">Email:</label>
        <input type="email" name="email" id="courriel" /><br />

        <label for="motDePasse">Mot de passe:</label>
        <input type="password" name="password" id="motDePasse" min="8" /><br />

        <button>S'inscrire</button>
      </form>
    </section>

    <!-- Exercice 12: Formulaire de contact avec méthode GET -->
    <section>
      <h2>Formulaire de contact</h2>
      <!-- À COMPLÉTER: Créer le formulaire de contact -->
      <form action="../resultats/contact.html" method="get">
        <label for="sujet">Sujet:</label>
        <input type="text" name="sujet" id="sujet" /><br />

        <label for="message">Message:</label><br />
        <textarea
          name="message"
          id="message"
          cols="50"
          rows="4"
          placeholder="Votre message"
        ></textarea>
      </form>
    </section>

    <!-- Exercice 13: Formulaire avec validation -->
    <section>
      <h2>Formulaire de commande</h2>
      <!-- À COMPLÉTER: Créer le formulaire avec validation -->
      <form action="../resultats/inscription.html" method="GET">
        <input
          type="number"
          name="quantite"
          id="quantite"
          min="1"
          max="10"
          value="1"
        />
        <input type="date" name="livraison" id="livraison" required />
        <input
          type="text"
          name="telephone"
          id="telephone"
          min="10"
          max="10"
        /><br />
        <input type="checkbox" name="conditions" id="conditions" />
        <label for="conditions">J'accepte les conditions</label>
        <h1>Mode de paiement</h1>
        <input type="radio" name="paiement" id="paiement1" value="carte" />
        <input type="radio" name="paiement" id="paiement2" value="paypal" />
        <input type="radio" name="paiement" id="paiement3" value="virement" />
      </form>
    </section>

    <!-- Navigation -->
    <nav>
      <!-- À COMPLÉTER: Liens de navigation relatifs -->
      <a href="listes.html">Listes</a>
      <a href="multimedia.html">Multimédia</a>
      <a href="tableaux.html">Tableaux</a>
    </nav>
  </body>
</html>
